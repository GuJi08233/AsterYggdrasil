# cargo-audit 配置
# 忽略已确认不影响本项目的上游传递依赖 advisory

[advisories]
ignore = [
    # paste 1.0.x unmaintained — dtolnay 不再维护
    # 纯编译期宏，零运行时代码，无安全风险
    "RUSTSEC-2024-0436",

    # h2 0.3.x 空 DATA 帧无界排队。actix-web 用 HttpServer::bind()（.tcp()），
    # 只接受 HTTP/1.x；未启用 bind_auto_h2c / TLS ALPN，运行期走不到 h2 0.3。
    # 0.4 线的 h2 已升到 0.4.16（出站 HTTP/2 走这里）。
    "RUSTSEC-2026-0258",

    # quinn-proto DoS 系列：HTTP/3 未启用，`cargo tree -i quinn` 无输出，
    # quinn 只作为 reqwest 的可选特性存在，未编译进产物。
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",

    # zip 3.0.0 解压类问题：只经 utoipa-swagger-ui 的 openapi feature 引入，
    # 解压的是编译期嵌入的可信 Swagger UI 资源，不处理用户上传。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # zip 3.0.0 ZipArchive::extract() 按条目声明的 size 预分配符号链接缓冲区
    # （Vec::with_capacity），恶意 ZIP64 可致进程 abort。该 API 只在 build-dependency
    # utoipa-swagger-ui 的 build.rs 里出现，且实际走的是 by_index() + enclosed_name()
    # + 流式 io::copy()，并未调用 extract()；解压对象是 crates.io 发布包内置的官方
    # Swagger UI 资源，运行期不触碰。升级需 utoipa-swagger-ui 10 + utoipa 6，
    # 而 utoipa 6 由 AsterForge pin 的 workspace 版本决定，待跟进上游 revision 时一并移除。
    "RUSTSEC-2026-0429",

    # rkyv 0.7.46：rust_decimal 的可选 feature，本项目未启用。
    "RUSTSEC-2026-0235",

    # rsa Marvin 时序攻击：上游至今无补丁（0.9 / 0.10-rc 均受影响）。
    # 本项目的 RSA 用途是 Yggdrasil 材质签名（PKCS#1 v1.5 SHA1），
    # 通过网络侧信道恢复私钥需要海量精确计时样本，列为已知残余风险。
    "RUSTSEC-2023-0071",

    # crypto-bigint 常数时间问题：0.7 线已升到修复版（>=0.7.6）。0.5.5 无补丁，
    # 经 elliptic-curve 0.13 被 openidconnect / webauthn-rs（p256 验签，只处理公开数据）
    # 和 aws-sigv4（仅 S3 多区域接入点走 SigV4a 时用派生私钥签名）引入。
    # 远程计时出站签名不现实，列为已知残余风险；注意此 ignore 按 ID 生效，0.7 线不得回退。
    "RUSTSEC-2026-0387",

    # ttf-parser / proc-macro-error2 unmaintained，非可利用漏洞。
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0173",
]
